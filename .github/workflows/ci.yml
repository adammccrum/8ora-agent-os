name: Agent OS CI
on:
  push:
    branches: [main, feat/private-brain-24x7]
  pull_request:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Verify Cloudflare Worker bundles without deployment
        run: npx wrangler deploy --dry-run --outdir dist/worker-check
      - name: Commit validated bundle to isolated release path
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/private-brain-24x7'
        run: |
          mkdir -p release
          cp dist/worker-check/index.js release/worker.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/worker.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'build: validated Worker bundle [skip ci]'
            git push
          fi
      - name: Preserve verified Worker build for deployment
        uses: actions/upload-artifact@v4
        with:
          name: brain2-worker-build
          path: dist/worker-check/
          if-no-files-found: error
          retention-days: 7
      - name: Verify isolated live deployment stays locked
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/private-brain-24x7'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = 'https://8ora-agent-os.long-river-2983.workers.dev';
          const health = await fetch(base + '/health');
          assert.equal(health.status, 200);
          const state = await health.json();
          assert.equal(state.service, '8ora-agent-os');
          assert.equal(state.autonomousExecutionEnabled, false);
          const dashboard = await fetch(base);
          assert.equal(dashboard.status, 200);
          assert.ok((await dashboard.text()).includes('Private founder dashboard'));
          assert.ok(dashboard.headers.get('content-security-policy')?.includes("frame-ancestors 'none'"));
          for (const route of ['/ready', '/v1/jobs', '/v1/audit', '/v1/agents', '/v1/brain2/queue/health']) {
            const response = await fetch(base + route);
            assert.equal(response.status, 401, route);
          }
          console.log('PASS: live health, dashboard, CSP, five protected routes, autonomous execution disabled');
          NODE
