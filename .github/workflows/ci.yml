name: Agent OS CI
on:
  push:
    branches: [main, feat/private-brain-24x7]
  pull_request:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Verify Cloudflare Worker bundles without deployment
        run: npx wrangler deploy --dry-run --outdir dist/worker-check
      - name: Commit validated bundle to isolated release path
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/private-brain-24x7'
        run: |
          mkdir -p release
          cp dist/worker-check/index.js release/worker.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/worker.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'build: validated Worker bundle [skip ci]'
            git push
          fi
      - name: Preserve verified Worker build for deployment
        uses: actions/upload-artifact@v4
        with:
          name: brain2-worker-build
          path: dist/worker-check/
          if-no-files-found: error
          retention-days: 7
