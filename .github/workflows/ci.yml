name: Agent OS CI
on:
  push:
    branches: [main, feat/private-brain-24x7]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Verify Cloudflare Worker bundles without deployment
        run: npx wrangler deploy --dry-run --outdir dist/worker-check
      - name: Preserve verified Worker build for deployment
        uses: actions/upload-artifact@v4
        with:
          name: brain2-worker-build
          path: dist/worker-check/
          if-no-files-found: error
          retention-days: 7
