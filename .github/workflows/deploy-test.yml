name: Deploy Agent OS Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-os-test-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: agent-os-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Normalize and verify Cloudflare configuration
        env:
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          trim() {
            printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          }

          CLOUDFLARE_ACCOUNT_ID="$(trim "$RAW_CLOUDFLARE_ACCOUNT_ID")"
          CLOUDFLARE_API_TOKEN="$(trim "$RAW_CLOUDFLARE_API_TOKEN")"
          D1_DATABASE_ID="$(trim "$RAW_D1_DATABASE_ID")"

          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

          if ! printf '%s' "$D1_DATABASE_ID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "::error::D1_DATABASE_ID is not a valid UUID after whitespace normalization."
            exit 1
          fi

          {
            echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID"
            echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN"
            echo "D1_DATABASE_ID=$D1_DATABASE_ID"
          } >> "$GITHUB_ENV"

      - name: Build test Wrangler configuration
        run: |
          sed "s/REPLACE_WITH_D1_DATABASE_ID/$D1_DATABASE_ID/g" wrangler.jsonc > wrangler.test.jsonc

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply 8ora-agent-os --remote --config wrangler.test.jsonc

      - name: Deploy test Worker
        run: npx wrangler deploy --config wrangler.test.jsonc
