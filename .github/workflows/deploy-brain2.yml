name: Deploy Brain 2 (manual, isolated)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: brain2-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify Worker build
        run: npx wrangler deploy --dry-run --outdir dist/worker-check
      - name: Verify target and credentials are isolated
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BRAIN2_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.BRAIN2_CLOUDFLARE_API_TOKEN }}
        run: |
          test "$CLOUDFLARE_ACCOUNT_ID" = "e5aaa129d84357470def077613f3200e"
          test -n "$CLOUDFLARE_API_TOKEN"
          grep -q '"name": "8ora-agent-os"' wrangler.jsonc
          grep -q 'dea5f56c-3636-494a-9c2a-6a90fd32a078' wrangler.jsonc
      - name: Deploy only 8ora-agent-os (no other website)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BRAIN2_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.BRAIN2_CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --keep-vars
